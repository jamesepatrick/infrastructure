repos:
  # Terraform formatting and validation
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.106.0
    hooks:
      - id: terraform_fmt
        exclude: ^\.bankruptcy/
      - id: terraform_validate
        exclude: ^\.bankruptcy/
      - id: terraform_tflint
        exclude: ^\.bankruptcy/

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.bankruptcy/
      - id: end-of-file-fixer
        exclude: ^\.bankruptcy/
      - id: check-yaml
        exclude: ^\.bankruptcy/

  # Security checks with Talisman
  - repo: https://github.com/thoughtworks/talisman
    rev: v1.37.0
    hooks:
      - id: talisman-commit
        exclude: ^\.bankruptcy/

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint-fix
        exclude: ^\.bankruptcy/
